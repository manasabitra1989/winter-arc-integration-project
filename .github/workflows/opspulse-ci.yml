name: OpsPulse CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and Test OpsPulse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Flask
        run: python -m pip install "Flask>=3.1,<4"

      - name: Validate Python syntax
        run: |
          python -m py_compile app/app.py
          python -m py_compile releases/app-v2.py

      - name: Validate Bash scripts
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/health-check.sh
          bash -n scripts/server-health.sh

      - name: Test Flask API endpoints
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "app")
          from app import app

          client = app.test_client()

          response = client.get("/")
          assert response.status_code == 200
          assert response.get_json()["application"] == "OpsPulse"

          response = client.get("/health")
          assert response.status_code == 200
          assert response.get_json()["status"] == "healthy"

          print("OpsPulse Flask API tests passed!")
          PY

      - name: CI validation successful
        run: echo "OpsPulse CI checks passed!"
