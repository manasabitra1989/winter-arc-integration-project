apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspulse-app
  namespace: opspulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspulse-app
  template:
    metadata:
      labels:
        app: opspulse-app
    spec:
      containers:
        - name: opspulse
          image: opspulse:day34
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: opspulse-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opspulse-db-secret
                  key: DATABASE_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: opspulse-app
  namespace: opspulse
spec:
  type: ClusterIP
  selector:
    app: opspulse-app
  ports:
    - port: 8080
      targetPort: 8080
